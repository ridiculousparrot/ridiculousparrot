name: Generate profile stats

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      - name: Download stats SVG
        run: >
          curl -s
          "https://github-readme-stats.vercel.app/api?username=ridiculousparrot&show_icons=true&theme=tokyonight&hide_border=true"
          -o profile/stats.svg

      - name: Download top languages SVG
        run: >
          curl -s
          "https://github-readme-stats.vercel.app/api/top-langs/?username=ridiculousparrot&layout=compact&theme=tokyonight&hide_border=true"
          -o profile/top-langs.svg

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git diff --cached --quiet || git commit -m "chore: update profile stats SVGs"
          git push
