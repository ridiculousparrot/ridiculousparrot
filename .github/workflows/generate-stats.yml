name: Generate profile stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      - name: Download stats SVG
        run: |
          curl -L --fail \
            "https://github-readme-stats-olive-psi-34.vercel.app/api?username=ridiculousparrot&show_icons=true&theme=tokyonight&hide_border=true" \
            -o profile/stats.svg

      - name: Download top languages SVG
        run: |
          curl -L --fail \
            "https://github-readme-stats-olive-psi-34.vercel.app/api/top-langs/?username=ridiculousparrot&layout=compact&theme=tokyonight&hide_border=true" \
            -o profile/top-langs.svg

      - name: Validate SVG files
        run: |
          grep -q "<svg" profile/stats.svg
          grep -q "<svg" profile/top-langs.svg

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          git diff --cached --quiet || git commit -m "chore: update profile stats SVGs"

          git push
